name: "AEG Oven Local Bridge"
version: "0.4.1"
slug: "oven_local"
description: "Local bridge for an AEG/Electrolux oven. Impersonates the Electrolux MQTT broker on the LAN (ARP redirect) and publishes the oven's telemetry to Home Assistant via MQTT discovery. Proof of concept."
url: "https://github.com/hugop/aeg-oven-local"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: manual
init: false
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
services:
  - mqtt:need
options:
  bridge_mode: mock
  upstream_host: mqtt-ecc.eu.ecp.electrolux.com
  upstream_port: 8883
  upstream_tls_mode: ca
  upstream_cert_sha256: ""
  proxy_source_ip: 192.168.178.2
  capture_commands: false
  oven_ip: "192.168.178.124"
  oven_mac: "44:3e:07:79:bf:4a"
  gateway_ip: "192.168.178.1"
  interface: ""
  own_redirect: true
  mqtt_host: ""
  mqtt_port: 0
  mqtt_user: ""
  mqtt_password: ""
  log_level: "info"
schema:
  bridge_mode: "list(mock|proxy)"
  upstream_host: str
  upstream_port: port
  upstream_tls_mode: "list(ca|pinned)"
  upstream_cert_sha256: "str?"
  proxy_source_ip: str
  capture_commands: bool
  oven_ip: str
  oven_mac: "str?"
  gateway_ip: str
  interface: "str?"
  own_redirect: "bool?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_user: "str?"
  mqtt_password: "str?"
  log_level: "list(debug|info|warning|error)?"
